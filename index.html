<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Interval Timer"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Interval Timer V4</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#090f20;color:#f5f7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:520px;margin:auto;padding:24px 0 42px}.top{display:flex;align-items:center;justify-content:space-between;color:#9da9ba;font-size:12px;letter-spacing:2px;font-weight:800}.chip{background:#283855;border-radius:99px;padding:9px 14px;color:#fff;letter-spacing:0}.timer{text-align:center;padding:50px 0 32px}.clock{font-size:clamp(92px,22vw,152px);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-7px}.progress{height:9px;background:#303a4a;border-radius:20px;overflow:hidden}.fill{height:100%;background:#35f3a3;width:0%;transition:width .12s linear}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:10px;margin:24px 0}.stats small{display:block;color:#9da9ba;margin-bottom:7px}.stats strong{font-size:18px}.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}button{border:0;border-radius:14px;padding:16px 10px;font-size:16px;font-weight:750;cursor:pointer;touch-action:manipulation}.primary{background:#35f3a3;color:#0d241a}.secondary{background:#283855;color:#fff}.card{background:#17243a;border:1px solid #2e3949;border-radius:20px;padding:20px;margin-top:25px}h2{font-size:18px;margin:0 0 18px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;color:#b7c2d0;font-size:13px}input{display:block;width:100%;background:#101824;border:1px solid #39475a;color:#fff;border-radius:10px;padding:12px;font-size:21px;font-weight:700;margin-top:8px}p{font-size:12px;color:#a3afbf;line-height:1.6}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.presets button{font-size:13px;padding:13px 4px}.presets span{display:block;color:#a3afbf;font-size:12px;margin-top:4px}#status{text-align:center;color:#a3afbf;font-size:13px;margin-top:20px}.done .clock{color:#35f3a3}.timer{border-radius:24px;background:linear-gradient(160deg,#162947,#10172b);margin-top:20px;padding-left:10px;padding-right:10px}.clock{color:#35f3a3;white-space:nowrap}.phase-work .clock{color:#35f3a3}.phase-rest .clock,.phase-roundRest .clock{color:#ffbd52}.phase-prepare .clock{color:#6ab9ff}.chip{font-weight:900}.phase-work .chip{background:#126e4d}.phase-rest .chip,.phase-roundRest .chip{background:#8c520c}.phase-prepare .chip{background:#2459a8}@media(max-width:390px){.clock{font-size:clamp(76px,20vw,110px);letter-spacing:-5px}}
.audio-test{background:#6741a4;color:#fff}@media(min-width:650px){main{max-width:680px}}
main{max-width:100%;padding:12px 0 36px}.top{padding:4px 2px}.timer{margin-top:12px;padding:clamp(38px,9vh,90px) 2px 32px;background:linear-gradient(160deg,#153558,#0c1930)}.clock{font-size:clamp(90px,25vw,240px);letter-spacing:-.075em;line-height:1.12;white-space:nowrap}.stats{margin:14px 0 20px}.progress{height:13px}.actions button{font-size:18px;padding:19px 10px}@media(max-width:380px){.clock{font-size:25vw;letter-spacing:-.075em}}
</style></head><body><main><div class="top"><span>INTERVAL TIMER</span><span id="phase" class="chip">READY</span></div><section class="timer" id="timer"><div class="clock" id="clock">01:00</div><div class="progress"><div class="fill" id="fill"></div></div></section><div class="stats"><div><small>組數</small><strong id="setInfo"></strong></div><div><small>週期</small><strong id="roundInfo"></strong></div><div><small>總剩餘</small><strong id="totalInfo"></strong></div></div><div class="actions"><button class="primary" id="start">▶ 開始</button><button class="secondary" id="reset">↺ 重設</button></div><div class="extras"><button class="secondary" id="skip">下一階段 →</button><button class="secondary" id="sound">♫ 音效開啟</button></div><div class="extras"><button class="audio-test" id="testSound" style="grid-column:1/-1">🔊 測試人聲 3、2、1</button></div><section class="card"><h2>訓練設定</h2><div class="inputs"><label>開始預備時間（秒）<input id="prepare" type="number" min="0" max="36000" value="10"></label><label>訓練時間（秒）<input id="work" type="number" min="1" max="36000" value="60"></label><label>休息時間（秒）<input id="rest" type="number" min="0" max="36000" value="30"></label><label>每週期組數<input id="sets" type="number" min="1" max="999" value="4"></label><label>總週期數<input id="rounds" type="number" min="1" max="999" value="3"></label><label style="grid-column:span 2">週期間休息（秒）<input id="roundRest" type="number" min="0" max="36000" value="60"></label></div><p>修改數值後按「重設」套用。最後一組不會增加休息時間。每階段最後 3 秒會播放中文語音「三、二、一」。首次使用請按「測試人聲」，並確認 iPhone 媒體音量。</p></section><div class="presets"><button class="secondary" data-preset="tabata">Tabata<span>20 / 10</span></button><button class="secondary" data-preset="hyrox">HYROX<span>60 / 30</span></button><button class="secondary" data-preset="strength">重量訓練<span>45 / 90</span></button></div><div id="status" aria-live="polite">準備開始訓練</div></main><script>
const $=id=>document.getElementById(id);let cfg,steps=[],idx=0,remaining=60,duration=60,running=false,deadline=0,handle=null,sound=true,audio=null,lastCountdown=null;const keys=['prepare','work','rest','sets','rounds','roundRest'];try{const saved=JSON.parse(localStorage.getItem('interval-config')||'{}');keys.forEach(k=>{if(saved[k]!==undefined)$(k).value=saved[k]});sound=localStorage.getItem('interval-sound')!=='false'}catch(e){}$('sound').textContent=sound?'♫ 音效開啟':'♫ 靜音';const get=(id,min,max)=>Math.max(min,Math.min(max,Math.floor(Number($(id).value)||min)));const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};function build(){cfg={prepare:get('prepare',0,36000),work:get('work',1,36000),rest:get('rest',0,36000),sets:get('sets',1,999),rounds:get('rounds',1,999),roundRest:get('roundRest',0,36000)};localStorage.setItem('interval-config',JSON.stringify(cfg));steps=[];if(cfg.prepare)steps.push({type:'prepare',duration:cfg.prepare,r:1,s:1});for(let r=1;r<=cfg.rounds;r++)for(let s=1;s<=cfg.sets;s++){steps.push({type:'work',duration:cfg.work,r,s});if(s<cfg.sets&&cfg.rest)steps.push({type:'rest',duration:cfg.rest,r,s});else if(s===cfg.sets&&r<cfg.rounds&&cfg.roundRest)steps.push({type:'roundRest',duration:cfg.roundRest,r,s})}}let unlocked=false,wakeLock=null;const voiceFiles={1:'count-1.mp3',2:'count-2.mp3',3:'count-3.mp3'};const voiceAudio={};for(const n of [1,2,3]){const a=new Audio(voiceFiles[n]);a.preload='auto';voiceAudio[n]=a;}function unlockVoices(){for(const n of [1,2,3]){try{voiceAudio[n].load()}catch(e){}}}function ensureAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;audio=audio||new C();if(audio.state==='suspended')audio.resume();unlocked=true;return true}catch(e){return false}}
function beep(freq=850,seconds=.15){if(!sound)return;try{if(!ensureAudio())return;const osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;osc.type='sine';osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.42,now+.012);gain.gain.exponentialRampToValueAtTime(.001,now+seconds);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+seconds+.025)}catch(e){console.warn('Audio unavailable',e)}}
function countdownBeep(n){if(!sound)return;try{const a=voiceAudio[n];a.pause();a.currentTime=0;a.volume=1;const play=a.play();if(play&&play.catch)play.catch(()=>beep(n===1?1150:850,.23))}catch(e){beep(n===1?1150:850,.23)}}
async function requestWake(){try{if('wakeLock'in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{wakeLock?.release()}catch(e){}wakeLock=null}
const current=()=>steps[idx];function total(){return remaining+steps.slice(idx+1).reduce((a,s)=>a+s.duration,0)}function render(){const s=current(),type=s?.type||'done';$('phase').textContent=type==='prepare'?'READY 預備':type==='work'?'WORK 訓練':type==='rest'?'REST 休息':type==='roundRest'?'週期間休息':'FINISH 完成';$('clock').textContent=fmt(remaining);$('setInfo').textContent=(s?.s||cfg.sets)+' / '+cfg.sets;$('roundInfo').textContent=(s?.r||cfg.rounds)+' / '+cfg.rounds;$('totalInfo').textContent=fmt(total());$('fill').style.width=(duration?Math.min(100,Math.max(0,(duration-remaining)/duration*100)):100)+'%';$('fill').style.background=type==='work'?'#5de1a4':'#f4b95b';$('timer').className='timer phase-'+type+(type==='done'?' done':'');document.body.className='phase-'+type;$('start').textContent=running?'Ⅱ 暫停':type==='done'?'↺ 再來一次':'▶ '+(remaining===duration?'開始':'繼續');$('status').textContent=type==='done'?'訓練完成！':type==='prepare'?'準備開始，倒數中！':type==='work'?'保持節奏，完成這一組':type==='rest'||type==='roundRest'?'調整呼吸，準備下一組':'準備開始'}function next(){idx++;lastCountdown=null;if(idx>=steps.length){running=false;clearInterval(handle);releaseWake();remaining=0;duration=1;beep(1046,.4);render();return}duration=steps[idx].duration;remaining=duration;deadline=performance.now()+duration*1000;beep(steps[idx].type==='work'?1200:650,.25);render()}function tick(){if(!running)return;const now=performance.now();if(now>=deadline){next();return}const n=Math.max(0,Math.ceil((deadline-now)/1000));if(n!==remaining){const prev=remaining;remaining=n;if(n>0&&n<=3&&lastCountdown!==n){lastCountdown=n;countdownBeep(n)}}render()}function reset(){running=false;clearInterval(handle);releaseWake();build();idx=0;duration=steps[0].duration;remaining=duration;lastCountdown=null;render()}$('start').onclick=()=>{if(!current())reset();if(running){remaining=Math.max(0,(deadline-performance.now())/1000);running=false;clearInterval(handle);releaseWake();render();return}ensureAudio();unlockVoices();requestWake();running=true;deadline=performance.now()+remaining*1000;lastCountdown=null;beep(1050,.15);handle=setInterval(tick,100);render()};$('reset').onclick=reset;$('skip').onclick=()=>{if(current())next()};$('sound').onclick=()=>{sound=!sound;localStorage.setItem('interval-sound',sound);$('sound').textContent=sound?'♫ 音效開啟':'♫ 靜音';if(sound){ensureAudio();unlockVoices();countdownBeep(3)}};$('testSound').onclick=()=>{sound=true;localStorage.setItem('interval-sound','true');$('sound').textContent='♫ 音效開啟';ensureAudio();unlockVoices();countdownBeep(3);setTimeout(()=>countdownBeep(2),850);setTimeout(()=>countdownBeep(1),1700)};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const values={tabata:[10,20,10,8,1,0],hyrox:[10,60,30,8,2,90],strength:[10,45,90,4,3,120]}[b.dataset.preset];keys.forEach((k,i)=>$(k).value=values[i]);reset()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){tick();requestWake()}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});reset();
</script></body></html>
